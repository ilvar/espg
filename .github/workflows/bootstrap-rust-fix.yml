name: bootstrap-rust-fix

on:
  push:
    branches: [agent/rust-strictrs-rewrite]
    paths:
      - .github/workflows/bootstrap-rust-fix.yml

permissions:
  contents: write

jobs:
  rewrite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
      - name: Reconstruct rewrite
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import io
          import pathlib
          import re
          import tarfile

          workflow = pathlib.Path('.github/workflows/bootstrap-rust-rewrite.yml').read_text()
          parts = re.findall(r"printf '%s' '([^']+)' >> /tmp/espg\.b64", workflow)
          if not parts:
              raise SystemExit('embedded rewrite archive not found')
          payload = base64.b64decode(''.join(parts))
          with tarfile.open(fileobj=io.BytesIO(payload), mode='r:gz') as archive:
              archive.extractall('.')
          PY
          rm -f go.mod integration_test.go main.go main_test.go
          python3 - <<'PY'
          from pathlib import Path

          app = Path('src/app.rs')
          source = app.read_text()
          source = source.replace('let params: [&(dyn ToSql + Sync); 2] = [id, &value];', 'let params: [&(dyn ToSql + Sync); 2] = [&id, &value];')
          source = source.replace('let params: [&(dyn ToSql + Sync); 2] = [id, &document];', 'let params: [&(dyn ToSql + Sync); 2] = [&id, &document];')
          source = source.replace('fn validate_index(index: &str) -> Result<(), Response> {', '#[allow(clippy::result_large_err)]\nfn validate_index(index: &str) -> Result<(), Response> {')
          source = source.replace('fn parse_required_document(body: &[u8]) -> Result<Map<String, Value>, Response> {', '#[allow(clippy::result_large_err)]\nfn parse_required_document(body: &[u8]) -> Result<Map<String, Value>, Response> {')
          source = source.replace('fn parse_optional_object(body: &[u8]) -> Result<Map<String, Value>, Response> {', '#[allow(clippy::result_large_err)]\nfn parse_optional_object(body: &[u8]) -> Result<Map<String, Value>, Response> {')
          app.write_text(source)

          query = Path('src/query.rs')
          source = query.read_text().replace('if lines.len() % 2 != 0 {', 'if !lines.len().is_multiple_of(2) {')
          query.write_text(source)

          main = Path('src/main.rs')
          source = main.read_text()
          source = source.replace('use std::process::ExitCode;\n', '')
          source = source.replace('async fn main() -> ExitCode {', 'async fn main() -> capability::ExitCode {')
          source = source.replace('Ok(()) => ExitCode::SUCCESS,', 'Ok(()) => capability::ExitCode::SUCCESS,')
          source = source.replace('            ExitCode::FAILURE', '            capability::ExitCode::FAILURE')
          source = source.replace('mod capability {\n    use axum::Router;', 'mod capability {\n    pub use std::process::ExitCode;\n\n    use axum::Router;')
          main.write_text(source)
          PY
          rm -f .github/workflows/bootstrap-rust-rewrite.yml .github/workflows/bootstrap-rust-fix.yml
      - name: Format
        run: cargo +1.97.1 fmt
      - name: Clippy
        run: cargo +1.97.1 clippy --all-targets --all-features -- -D warnings
      - name: Tests
        run: cargo +1.97.1 test --all-targets --all-features
      - name: Install strictrs
        run: cargo +1.97.1 install --git https://github.com/ilvar/strictrs
      - name: Strict Rust check
        run: strictrs check .
      - name: Integration smoke test
        run: ./scripts/run-integration-tests.sh
      - name: Commit rewrite
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Rewrite espg in Rust with strictrs'
          git push origin HEAD:${GITHUB_REF_NAME}

name: bootstrap-rust-rewrite

on:
  push:
    branches: [agent/rust-strictrs-rewrite]
    paths:
      - .github/workflows/bootstrap-rust-rewrite.yml

permissions:
  contents: write

jobs:
  rewrite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
      - name: Unpack rewrite
        shell: bash
        run: |
          : > /tmp/espg.b64
          printf '%s' '' >> /tmp/espg.b64
          printf '%s' '' >> /tmp/espg.b64
          printf '%s' '' >> /tmp/espg.b64
          printf '%s' '' >> /tmp/espg.b64
          printf '%s' '' >> /tmp/espg.b64
          printf '%s' '' >> /tmp/espg.b64
          base64 -d /tmp/espg.b64 | tar -xzf -
          rm -f go.mod integration_test.go main.go main_test.go
          rm -f .github/workflows/bootstrap-rust-rewrite.yml
      - name: Format
        run: cargo +1.97.1 fmt
      - name: Clippy
        run: cargo +1.97.1 clippy --all-targets --all-features -- -D warnings
      - name: Tests
        run: cargo +1.97.1 test --all-targets --all-features
      - name: Install strictrs
        run: cargo +1.97.1 install --git https://github.com/ilvar/strictrs
      - name: Strict Rust check
        run: strictrs check .
      - name: Integration smoke test
        run: ./scripts/run-integration-tests.sh
      - name: Commit rewrite
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Rewrite espg in Rust with strictrs'
          git push origin HEAD:${GITHUB_REF_NAME}
